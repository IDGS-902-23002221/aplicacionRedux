<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- fondo a sangre completa para que el maskable no quede con bordes -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7468ff"/>
      <stop offset="1" stop-color="#3a2fae"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- lista: punto + linea por fila, centrada en la zona segura -->
  <g fill="#ffffff">
    <circle cx="148" cy="170" r="20"/>
    <rect x="196" y="152" width="168" height="36" rx="18"/>

    <circle cx="148" cy="256" r="20"/>
    <rect x="196" y="238" width="210" height="36" rx="18"/>

    <circle cx="148" cy="342" r="20"/>
    <rect x="196" y="324" width="140" height="36" rx="18"/>
  </g>
</svg>
